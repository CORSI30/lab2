<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Help Desk main</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <header class="header">
        <div class="container header__inner">
            <div class="logo">Help Desk</div>
            <nav class="nav">
                <a href="#" class="nav__link">Обращения</a>
                <a href="#" class="nav__link">Создание обращения</a>
            </nav>
        </div>
    </header>

    <main class="main-content">
        <div class="container">
            
            <section class="hero-section">
                <h1 class="main-title">Мои обращения</h1>
            </section>

            <div class="cards-grid">
                
                <article class="card">
                    <h3 class="card__title">Не открывается сайт</h3>
                    <p class="card__text">Статус: В работе</p>
                    <a href="#" class="card__link">https://github.com</a>
                    <button class="btn">Подробнее</button>
                </article>

                <article class="card">
                    <h3 class="card__title">Не могу зайти в профиль</h3>
                    <p class="card__text">Статус: Новое</p>
                    <a href="#" class="card__link">https://github.com/CORSI30/lab2/work-location-fort-shell-1123-end</a>
                    <button class="btn">Подробнее</button>
                </article>

                <article class="card">
                    <h3 class="card__title">Как выйти?</h3>
                    <p class="card__text">Статус: Завершён</p>
                    <a href="#" class="card__link">https://github.com</a>
                    <button class="btn">Подробнее</button>
                </article>

            </div>

        </div>
    </main>

</body>
</html>
